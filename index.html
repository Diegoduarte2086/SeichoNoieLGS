/* ---------- auditoria ---------- */
PG.logs=()=>{const us=[...new Set(S.logs.map(l=>l.u))],ts=[...new Set(S.logs.map(l=>l.type))],l=S.logs.filter(x=>(!L.u||x.u==L.u)&&(!L.d||day(x.d)==L.d)&&(!L.t||x.type==L.t)).slice(0,500);
return`<h2>Logs de auditoria</h2><div class="row"><select onchange="L.u=this.value;render()"><option value="">Todos os usuários</option>${us.map(u=>`<option ${L.u==u?'selected':''}>${esc(u)}</option>`).join('')}</select><input type="date" value="${L.d}" onchange="L.d=this.value;render()"><select onchange="L.t=this.value;render()"><option value="">Todas as ações</option>${ts.map(u=>`<option ${L.t==u?'selected':''}>${esc(u)}</option>`).join('')}</select></div><div class="card tw"><table><tr><th>Data/hora</th><th>Usuário</th><th>Ação</th><th>Detalhes</th></tr>${l.map(x=>`<tr><td>${dt(x.d)}</td><td>${esc(x.u)}<br><span class="mu">${esc(x.r)}</span></td><td>${pill(esc(x.type),'ix')}</td><td>${esc(x.det)}</td></tr>`).join('')}</table></div>`};
/* ---------- configurações ---------- */
PG.cfg=()=>{const c=S.cfg,i=(k,l,t)=>`<label>${l}</label><input id="c_${k}" type="${t||'text'}" value="${esc(c[k])}">`;
return`<h2>Configurações</h2><div class="g2"><div class="card"><h3>Empresa e recibo</h3>${i('name','Nome')}${i('cnpj','CNPJ (opcional)')}<label>CEP</label><input id="c_cep" value="${esc(c.cep)}" maxlength="9" placeholder="00000-000" oninput="cepLook(this)">${i('rua','Rua')}<div class="row"><div>${i('num','Número')}</div><div>${i('bairro','Bairro')}</div></div><div class="row"><div>${i('cidade','Cidade')}</div><div>${i('uf','UF')}</div></div><p class="mu">Endereço no recibo: ${esc(c.addr)}</p><h3 style="margin-top:16px">Pix</h3><label>Tipo de chave</label><select id="c_pixtype">${[['cpfcnpj','CPF / CNPJ'],['tel','Celular'],['email','E-mail'],['rand','Chave aleatória']].map(([v,l])=>`<option value="${v}" ${c.pixtype==v?'selected':''}>${l}</option>`).join('')}</select>${i('pixkey','Chave Pix')}${i('pixcity','Cidade do recebedor (até 15 letras, sem acento)')}<p class="mu">O nome do recebedor é o nome da empresa (até 25 letras, sem acentos).</p>${i('tel','Telefone / WhatsApp')}${i('foot','Mensagem de rodapé')}<label>Formato padrão de impressão</label><select id="c_fmt"><option value="58" ${c.fmt=='58'?'selected':''}>Térmica 58mm</option><option value="80" ${c.fmt=='80'?'selected':''}>Térmica 80mm</option><option value="a4" ${c.fmt=='a4'?'selected':''}>A4 meia página (preto e branco, logo colorida)</option></select><label>Logotipo (PNG/JPG)</label>${c.logo?`<img src="${c.logo}" style="max-height:60px;display:block;margin-bottom:6px">`:''}<input type="file" accept="image/png,image/jpeg" onchange="logoUp(this)">${c.logo?`<button class="btn sm s" onclick="S.cfg.logo='';save();render()">Remover logotipo</button>`:''}<div class="row" style="margin-top:14px"><button class="btn" onclick="saveCfg()">Salvar configurações</button></div></div>
<div><div class="card"><h3>Banco de dados único</h3><div class="row"><button class="btn" onclick="expDb()">Exportar .json</button><label class="btn s" style="margin:0;display:inline-block;cursor:pointer">Importar .json<input type="file" accept=".json" hidden onchange="impDb(this)"></label></div></div>
<div class="card"><h3>Usuários</h3><button class="btn sm" onclick="userForm()">Novo usuário</button><table>${S.users.map(u=>`<tr><td>${esc(u.name)}<br><span class="mu">${esc(u.login)} · ${RL[u.role]}</span></td><td>${u.on?pill('ativo','gr'):pill('inativo','rd')}</td><td><button class="btn sm s" onclick="userForm('${u.id}')">Editar</button></td></tr>`).join('')}</table></div><div class="card"><h3>Configurações avançadas</h3><p class="mu">Ações irreversíveis. Exigem a senha do administrador.</p><button class="btn r" onclick="rzStart()">Zerar o programa</button></div></div></div>`};
function rzStart(){if(U.role!='admin')return;modal(`<h3>Zerar o programa</h3><p class="mu">Apaga TUDO: produtos, estoque, vendas, encomendas, logs, usuários, dados da empresa, logotipo e chave Pix. Depois o sistema volta ao estado de fábrica, só com o usuário admin (senha 123).</p><label>Senha do administrador</label><input id="rz_p" type="password"><label>Motivo (obrigatório)</label><input id="rz_m"><div class="row" style="margin-top:16px"><button class="btn r" onclick="rzStep2()">Continuar</button><button class="btn s" onclick="closeM()">Cancelar</button></div>`)}
function rzStep2(){const p=$('#rz_p').value,m=$('#rz_m').value.trim();if(p!==U.pass)return toast('Senha incorreta');if(!m)return toast('Informe o motivo');window._rzm=m;modal(`<h3>Deseja zerar o programa?</h3><p>Motivo: ${esc(m)}</p><p>Esta ação é <b>irreversível</b>. Um arquivo de backup será baixado automaticamente antes de apagar, e você será desconectado ao final.</p><div class="row"><button class="btn r" onclick="rzStep3()">Sim</button><button class="btn s" onclick="closeM()">Não</button></div>`)}
function rzStep3(){modal(`<h3>Confirme a senha</h3><label>Senha do administrador</label><input id="rz_p2" type="password" onkeydown="if(event.key=='Enter')rzDo()"><div class="row" style="margin-top:16px"><button class="btn r" onclick="rzDo()">Zerar definitivamente</button><button class="btn s" onclick="closeM()">Cancelar</button></div>`)}
function rzDo(){if(U.role!='admin'||$('#rz_p2').value!==U.pass)return toast('Senha incorreta');const m=window._rzm,who=U.name;expDb();S={seq:0,cfg:{name:'Minha Empresa',addr:'',tel:'',foot:'Obrigado pela preferência!',fmt:'80',logo:'',cnpj:''},users:[{id:uid(),name:'Administrador',login:'admin',pass:'123',role:'admin',on:1}],products:[],moves:[],sales:[],orders:[],logs:[{d:new Date().toISOString(),u:who,r:'Administrador',type:'Sistema zerado',det:'Motivo: '+m}]};cart=[];CK={cli:''};U=null;save();closeM();loginView();toast('Programa zerado. Entre com admin / 123')}
async function cepLook(el){const v=el.value.replace(/\D/g,'');if(v.length!=8)return;try{const r=await(await fetch('https://viacep.com.br/ws/'+v+'/json/')).json();if(r.erro)return toast('CEP não encontrado');$('#c_rua').value=r.logradouro||'';$('#c_bairro').value=r.bairro||'';$('#c_cidade').value=r.localidade||'';$('#c_uf').value=r.uf||'';$('#c_num').focus()}catch(e){toast('Sem internet: preencha o endereço manualmente')}}
function saveCfg(){['name','tel','foot','fmt','cnpj','cep','rua','num','bairro','cidade','uf','pixtype','pixkey','pixcity'].forEach(k=>S.cfg[k]=$('#c_'+k).value);const c=S.cfg;if(c.rua||c.cidade)c.addr=[c.rua&&c.rua+(c.num?', '+c.num:''),c.bairro,c.cidade&&c.cidade+(c.uf?'/'+c.uf:''),c.cep&&'CEP '+c.cep].filter(Boolean).join(' - ');log('Configurações','Dados da empresa/recibo alterados');save();toast('Configurações salvas');render()}
function logoUp(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{S.cfg.logo=r.result;log('Configurações','Logotipo alterado');save();render()};r.readAsDataURL(f)}
function userForm(id){const u=S.users.find(x=>x.id==id)||{};form(id?'Editar usuário':'Novo usuário',[{k:'name',l:'Nome',v:u.name},{k:'login',l:'Login',v:u.login},{k:'pass',l:'Senha',v:u.pass},{k:'role',l:'Perfil',v:u.role||'caixa',o:Object.entries(RL)},{k:'on',l:'Situação',v:u.id?u.on:1,o:[[1,'Ativo'],[0,'Inativo']]}],v=>{if(!v.name.trim()||!v.login.trim()||!v.pass){toast('Preencha nome, login e senha');return false}if(S.users.some(x=>x.login==v.login&&x.id!=id)){toast('Login já existe');return false}const on=+v.on,adm=S.users.filter(x=>x.role=='admin'&&x.on&&x.id!=id).length;if((v.role!='admin'||!on)&&!adm&&(!id||u.role=='admin')&&id){toast('Deve restar ao menos um administrador ativo');return false}
const o={name:v.name.trim(),login:v.login.trim(),pass:v.pass,role:v.role,on};if(id)Object.assign(u,o);else S.users.push({id:uid(),...o});log('Usuário',`${id?'Editado':'Criado'}: ${o.login} (${RL[o.role]})`);save();render()})}
function expDb(){const n=new Date(),p=x=>String(x).padStart(2,'0'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download=`backup_sistema_${n.getFullYear()}-${p(n.getMonth()+1)}-${p(n.getDate())}_${p(n.getHours())}-${p(n.getMinutes())}.json`;a.click();log('Backup','Exportação do banco de dados');save()}
function impDb(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!['users','products','sales','orders','logs','moves'].every(k=>Array.isArray(d[k]))||!d.cfg||!d.users.some(u=>u.role=='admin'))throw 0;if(!confirm('Importar este arquivo substitui os dados atuais. Continuar?'))return;S=d;U=S.users.find(u=>u.login==U.login&&u.on)||S.users.find(u=>u.role=='admin');log('Backup','Importação do banco de dados: '+f.name);save();render();toast('Banco importado')}catch(e){toast('Arquivo inválido: estrutura não reconhecida')}};r.readAsText(f)}
/* ---------- início ---------- */
(async()=>{document.documentElement.dataset.t=localStorage.getItem('theme')||'';
if(!window.supabase){$('#root').innerHTML='<p style="padding:20px">Não foi possível carregar o sistema. Verifique a internet e recarregue a página.</p>';return}
sb=supabase.createClient(SB_URL,SB_KEY);
sb.auth.onAuthStateChange(ev=>{if(ev=='SIGNED_OUT'){S=null;U=null;gateView()}});
const{data:{session}}=await sb.auth.getSession();
if(!session)return gateView();
await start()})();
</script></body></html>
